name: CI RuangRasa

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python Source_Code/run_tests.py

      - name: Smoke test Streamlit app
        run: |
          python -m py_compile streamlit_app.py Source_Code/app/streamlit_app.py
          python -c "
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file('Source_Code/app/streamlit_app.py', default_timeout=90).run()
          assert not at.exception, f'App error: {[e.value for e in at.exception]}'
          [b for b in at.button if 'tinggi' in b.label][0].click().run()
          [b for b in at.button if b.label == 'Analisis'][0].click().run()
          assert not at.exception, f'Submit error: {[e.value for e in at.exception]}'
          print('Streamlit smoke test passed.')
          "
